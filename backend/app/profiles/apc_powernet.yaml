
profile:
  id: "apc_powernet"
  name: "APC PowerNet MIB"
  description: "Proprietary MIB for APC Smart-UPS and PowerNet PDUs"
  vendor: "Schneider Electric / APC"

# OIDs to query in a single bulk GET request
oids:
  input_voltage: ".1.3.6.1.4.1.318.1.1.1.3.2.1.0"
  output_voltage: ".1.3.6.1.4.1.318.1.1.1.4.2.1.0"
  current_draw_amps: ".1.3.6.1.4.1.318.1.1.1.4.2.4.0"
  output_load_percent: ".1.3.6.1.4.1.318.1.1.1.4.2.3.0"
  battery_charge_percent: ".1.3.6.1.4.1.318.1.1.1.2.2.1.0"
  battery_runtime_seconds: ".1.3.6.1.4.1.318.1.1.1.2.2.3.0"  # APC reports in hundredths of seconds (timeticks) or minutes
  power_status_raw: ".1.3.6.1.4.1.318.1.1.1.4.1.1.0"

# Transformation rules applied to raw integer responses
transforms:
  current_draw_amps:
    scale: 0.1             # APC reports deciamps (e.g. 52 -> 5.2 A)
    type: "float"
  battery_runtime_seconds:
    scale: 60              # Convert minutes to seconds
    type: "int"

# Status code mappings to standard PowerStatus enum ('normal', 'on_battery', 'low_battery', 'bypass', 'overload', 'offline')
status_mapping:
  target_oid: ".1.3.6.1.4.1.318.1.1.1.4.1.1.0"
  default: "normal"
  map:
    1: "unknown"
    2: "normal"            # Online / Normal
    3: "on_battery"        # On Battery
    4: "bypass"            # On Smart Boost
    5: "off"               # Timed Sleeping
