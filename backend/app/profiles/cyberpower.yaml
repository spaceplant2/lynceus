profile:
  id: "cyberpower"
  name: "CyberPower Enterprise MIB"
  description: "Proprietary MIB for CyberPower OR/PR series UPS models with SNMP cards"
  vendor: "CyberPower Systems"

# OIDs under CyberPower CPS subtree (.1.3.6.1.4.1.3808.1.1.1)
oids:
  input_voltage: ".1.3.6.1.4.1.3808.1.1.1.3.2.1.0"        # upsAdvInputLineVoltage
  output_voltage: ".1.3.6.1.4.1.3808.1.1.1.4.2.1.0"       # upsAdvOutputVoltage
  current_draw_amps: ".1.3.6.1.4.1.3808.1.1.1.4.2.4.0"   # upsAdvOutputCurrent
  output_load_percent: ".1.3.6.1.4.1.3808.1.1.1.4.2.3.0"     # upsAdvOutputLoad
  battery_charge_percent: ".1.3.6.1.4.1.3808.1.1.1.2.2.1.0" # upsAdvBatteryCapacity
  battery_runtime_seconds: ".1.3.6.1.4.1.3808.1.1.1.2.2.4.0"# upsAdvBatteryRunTimeRemaining (Minutes)
  power_status_raw: ".1.3.6.1.4.1.3808.1.1.1.4.1.1.0"        # upsAdvOutputStatus

# Metric transformations
transforms:
  current_draw_amps:
    scale: 0.1             # CyberPower reports deciamps (e.g., 55 -> 5.5 A)
    type: "float"
  battery_runtime_seconds:
    scale: 60              # Convert native minutes to seconds
    type: "int"

# Status code mappings (upsAdvOutputStatus: 2=online, 3=onBattery, 4=onBoost, 5=onBuck, 7=off)
status_mapping:
  target_oid: ".1.3.6.1.4.1.3808.1.1.1.4.1.1.0"
  default: "normal"
  map:
    1: "unknown"
    2: "normal"            # Online
    3: "on_battery"        # On Battery
    4: "degraded"          # Smart Boost
    5: "degraded"          # Smart Buck
    7: "offline"           # Switched Off
    