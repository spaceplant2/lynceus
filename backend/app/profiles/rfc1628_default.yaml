
profile:
  id: "rfc1628_default"
  name: "Standard RFC 1628 UPS MIB"
  description: "Generic RFC 1628 standard fallback for vendor-neutral UPS systems"
  vendor: "IETF Standard"

oids:
  input_voltage: ".1.3.6.1.2.1.33.1.3.3.1.3.1"
  output_voltage: ".1.3.6.1.2.1.33.1.4.4.1.2.1"
  current_draw_amps: ".1.3.6.1.2.1.33.1.4.4.1.3.1"
  output_load_percent: ".1.3.6.1.2.1.33.1.4.4.1.5.1"
  battery_charge_percent: ".1.3.6.1.2.1.33.1.2.4.0"
  battery_runtime_seconds: ".1.3.6.1.2.1.33.1.2.3.0"
  power_status_raw: ".1.3.6.1.2.1.33.1.2.1.0"

transforms:
  current_draw_amps:
    scale: 0.1
    type: "float"
  battery_runtime_seconds:
    scale: 60
    type: "int"

status_mapping:
  target_oid: ".1.3.6.1.2.1.33.1.2.1.0"
  default: "normal"
  map:
    2: "normal"
    3: "low_battery"
    4: "on_battery"
