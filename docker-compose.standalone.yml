---
# Lynceus - Standalone Docker Compose (Pre-built GHCR image only)
# For remote appliances or servers where the source code repository is NOT cloned.
# Usage:
#   docker compose -f docker-compose.standalone.yml up -d
#   (or rename this file to docker-compose.yml)

services:
  lynceus:
    image: ghcr.io/spaceplant2/lynceus:latest
    container_name: lynceus
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent configuration (YAML files) and encrypted SQLite vault (vault.db):
      - ./config:/app/config
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CONFIG_DIR=/app/config
      # Optional master encryption key:
      # - LYNCEUS_MASTER_KEY=my-secure-master-passphrase

    # Uncomment on Linux if direct subnet UDP broadcast is required:
    # network_mode: host
